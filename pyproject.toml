[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "workpapers-mcp"
version = "1.0.1"
description = "MCP server over an ITGC audit workpaper pack: four read-only tools to read workpapers, trace controls and list findings"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Al Amin Bashir Afara"}]
requires-python = ">=3.10"
dependencies = ["mcp"]
keywords = ["mcp", "it-audit", "itgc", "audit-workpapers", "grc", "internal-controls"]

[project.urls]
Homepage = "https://github.com/aminafara123/workpapers-mcp"
Repository = "https://github.com/aminafara123/workpapers-mcp"

[project.scripts]
workpapers-mcp = "workpapers_mcp:main"

[tool.setuptools]
py-modules = ["workpapers_mcp"]
